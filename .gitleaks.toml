# Gitleaks configuration for local and CI secret scanning.
#
# The full local check runs tests before gitleaks. Tests can create local runtime
# key material under ignored state directories; those files must never be tracked,
# but they should not make the repository-level secret scan permanently fail.

[allowlist]
description = "Ignore local runtime state directories and test fixture artifacts"
paths = [
  '''(^|/)\.ardur/''',
  '''(^|/)\.vibap/''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)__pycache__/''',
  '''(^|/)python/tests/artifacts/''',
  '''(^|/)python/vibap/_specs/''',
]

# Detect private key PEM blocks outside test artifacts.
# Ardur generates P-256 keys via the passport module serialized as PKCS8
# (-----BEGIN PRIVATE KEY-----). The rule also catches SEC1 EC and PKCS1 RSA
# variants so a format change or external key import does not silently bypass
# the scan. Any committed private key PEM is a secret-leak incident.
[[rules]]
id = "ardur-private-key-pem"
description = "Private key PEM block (PKCS8, SEC1 EC, PKCS1 RSA)"
regex = '''-----BEGIN (EC |RSA )?PRIVATE KEY-----'''
paths = [
  '''\.pem$''',
  '''\.py$''',
  '''\.md$''',
  '''\.json$''',
]
[rules.allowlist]
paths = [
  '''(^|/)python/tests/artifacts/''',
  '''(^|/)python/tests/test_real_world_harness_contract''',
  '''(^|/)\.ardur/''',
  '''(^|/)\.vibap/''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)__pycache__/''',
]
